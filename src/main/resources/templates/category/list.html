<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout('카테고리 관리', ~{::main}, ~{::scripts})}">
<body>
<main>
  <h2 class="page-title">카테고리 관리 <span class="sub">프론트 메뉴·게시물 분류에 사용됩니다</span></h2>

  <div class="row-2">
    <div class="card">
      <div class="card-head">
        <div class="left">
          <span class="count">(총 <span th:text="${#lists.size(categories)}">0</span> 건)</span>
        </div>
        <a class="btn primary" th:href="@{/admin/categories}" th:if="${form.id != null}">신규 등록</a>
      </div>
      <table class="list">
        <thead>
        <tr>
          <th style="width:72px">순서</th>
          <th>카테고리</th>
          <th style="width:120px">슬러그</th>
          <th style="width:70px" class="right">게시물</th>
          <th style="width:70px">표시</th>
          <th style="width:190px" class="right">액션</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(categories)}">
          <td colspan="6">
            <div class="empty-state">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 16s1.5-2 4-2 4 2 4 2"/><path d="M9 9h.01M15 9h.01"/></svg>
              <div>등록된 카테고리가 없습니다.</div>
            </div>
          </td>
        </tr>
        <tr th:each="c, it : ${categories}" th:classappend="${form.id == c.id} ? 'editing'">
          <td>
            <div class="actions">
              <form th:action="@{/admin/categories/{id}/move(id=${c.id})}" method="post">
                <input type="hidden" name="direction" value="up">
                <button class="btn ghost xs" type="submit" th:disabled="${it.first}" title="위로">▲</button>
              </form>
              <form th:action="@{/admin/categories/{id}/move(id=${c.id})}" method="post">
                <input type="hidden" name="direction" value="down">
                <button class="btn ghost xs" type="submit" th:disabled="${it.last}" title="아래로">▼</button>
              </form>
            </div>
          </td>
          <td>
            <div><b th:text="${c.name}">이름</b></div>
            <div class="muted" th:text="${c.description}" style="font-size:11px"></div>
          </td>
          <td class="mono" th:text="${c.slug}">slug</td>
          <td class="right" th:text="${c.postCount}">0</td>
          <td><span class="badge" th:classappend="${c.active} ? 'on' : 'off'" th:text="${c.active} ? '표시' : '숨김'">표시</span></td>
          <td class="right">
            <div class="actions">
              <a class="btn ghost xs" th:href="@{/admin/posts(categoryId=${c.id})}">게시물 보기</a>
              <a class="btn ghost xs" th:href="@{/admin/categories(edit=${c.id})}">수정</a>
              <form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post"
                    th:attr="data-confirm='[' + ${c.name} + '] 카테고리를 삭제할까요?'">
                <button class="btn danger xs" type="submit" th:disabled="${c.postCount > 0}"
                        th:title="${c.postCount > 0} ? '게시물이 연결되어 있어 삭제할 수 없습니다' : '삭제'">삭제</button>
              </form>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- 등록/수정 폼 -->
    <div class="card side-card">
      <div class="card-body">
        <h4 th:text="${form.id == null} ? '카테고리 등록' : '카테고리 수정'">카테고리 등록</h4>
        <form th:object="${form}" th:action="@{/admin/categories}" method="post">
          <input type="hidden" th:field="*{id}">
          <div class="alert error" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
          </div>
          <div class="form-grid">
            <label class="lbl req" for="name">이름</label>
            <div>
              <input class="input wide" th:field="*{name}" id="name" maxlength="50" placeholder="예: 공지사항">
              <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <label class="lbl" for="slug">슬러그</label>
            <div>
              <input class="input wide mono" th:field="*{slug}" id="slug" maxlength="50" placeholder="비우면 이름으로 자동 생성">
              <div class="help">프론트 URL 에 사용됩니다. 예: /category/notice</div>
              <div class="field-error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>
            </div>
            <label class="lbl" for="description">설명</label>
            <div>
              <input class="input wide" th:field="*{description}" id="description" maxlength="200">
              <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>
            <label class="lbl" for="sortOrder">정렬 순서</label>
            <div>
              <input class="input" type="number" th:field="*{sortOrder}" id="sortOrder" min="0" style="width:100px">
              <div class="help">0 이면 마지막 순서로 등록됩니다. 목록의 ▲▼ 로도 변경할 수 있습니다.</div>
            </div>
            <label class="lbl" for="active">표시</label>
            <label class="check" style="padding-top:0"><input type="checkbox" th:field="*{active}" id="active"> 프론트에 표시</label>
          </div>
          <div class="actions" style="margin-top:16px;justify-content:flex-end;display:flex">
            <a class="btn ghost" th:href="@{/admin/categories}" th:if="${form.id != null}">취소</a>
            <button class="btn primary" type="submit" th:text="${form.id == null} ? '등록' : '저장'">등록</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

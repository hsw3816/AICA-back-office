<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, content, scripts)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle} + ' | ' + ${siteName}">백오피스</title>
  <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
  <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : 'X-CSRF-TOKEN'">
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<!-- ===== 좌측 메뉴 ===== -->
<aside class="sidebar">
  <a class="brand" th:href="@{/admin}">
    <div class="brand-name" th:text="${siteName}">MY APP 운영툴</div>
    <div class="brand-env" th:text="${envLabel}">local</div>
  </a>

  <nav class="nav-group" th:if="${me != null and me.role.canManageContent()}" th:classappend="${menu == 'dashboard'} ? 'active'">
    <h3 class="nav-title">대시보드</h3>
    <a class="nav-item" th:classappend="${menu == 'dashboard'} ? 'active'" th:href="@{/admin}">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      현황 요약
    </a>
  </nav>

  <nav class="nav-group" th:classappend="${menu == 'posts' or menu == 'categories' or menu == 'faq'} ? 'active'">
    <h3 class="nav-title">콘텐츠</h3>
    <a class="nav-item" th:classappend="${menu == 'posts'} ? 'active'" th:href="@{/admin/posts}">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>
      게시물 관리
    </a>
    <a class="nav-item" th:if="${me != null and me.role.canManageContent()}" th:classappend="${menu == 'categories'} ? 'active'" th:href="@{/admin/categories}">
      <svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.2"/></svg>
      카테고리 관리
    </a>
    <a class="nav-item" th:classappend="${menu == 'faq'} ? 'active'" th:href="@{/admin/faq}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      FAQ 관리
    </a>
  </nav>

  <nav class="nav-group" th:if="${me != null and me.role.canManageContent()}" th:classappend="${menu == 'stats'} ? 'active'">
    <h3 class="nav-title">통계</h3>
    <a class="nav-item" th:classappend="${menu == 'stats'} ? 'active'" th:href="@{/admin/stats}">
      <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      방문자·조회수
    </a>
  </nav>

  <nav class="nav-group" th:classappend="${menu == 'users' or menu == 'password'} ? 'active'">
    <h3 class="nav-title">관리자</h3>
    <a class="nav-item" th:if="${me != null and me.superAdmin}"
       th:classappend="${menu == 'users'} ? 'active'" th:href="@{/admin/users}">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      관리자 계정
    </a>
    <a class="nav-item" th:classappend="${menu == 'password'} ? 'active'" th:href="@{/account/password}">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      비밀번호 변경
    </a>
  </nav>
</aside>

<!-- ===== 상단바 ===== -->
<header class="topbar">
  <form class="search" th:action="@{/admin/posts}" method="get" role="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" name="keyword" id="globalSearch" placeholder="게시물 제목·요약 검색" autocomplete="off">
    <span class="kbd">⌘ + K</span>
  </form>
  <div class="who" th:if="${me != null}">
    <span><b th:text="${me.name}">홍길동</b>(<span th:text="${me.role.label}">관리자</span>)님 어서오세요</span>
    <span class="avatar" th:text="${#strings.substring(me.name, 0, 1)}">홍</span>
    <form th:action="@{/logout}" method="post"><button type="submit">로그아웃</button></form>
  </div>
</header>

<!-- ===== 본문 ===== -->
<div class="main">
  <div class="toast" th:if="${toast}" th:text="${toast}"></div>
  <div class="toast error" th:if="${toastError}" th:text="${toastError}"></div>

  <main th:replace="${content}">페이지 본문</main>

  <footer class="footer">
    <span>Copyright © 2026 AICA</span>
  </footer>
</div>

<script th:src="@{/js/admin.js}"></script>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>

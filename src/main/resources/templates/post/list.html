<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout('게시물 목록', ~{::main}, ~{::scripts})}">
<body>
<main>
  <h2 class="page-title">게시물 목록</h2>

  <div class="card">
    <form class="card-head" th:action="@{/admin/posts}" method="get">
      <div class="left">
        <select class="select" name="status" onchange="this.form.submit()">
          <option value="" th:selected="${search.status == null}">전체 상태</option>
          <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.label}" th:selected="${search.status == st}"></option>
        </select>
        <select class="select" name="categoryId" onchange="this.form.submit()">
          <option value="" th:selected="${search.categoryId == null}">전체 카테고리</option>
          <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${search.categoryId == c.id}"></option>
        </select>
        <input class="input" type="search" name="keyword" th:value="${search.keyword}" placeholder="제목·요약 검색" style="width:200px">
        <button class="btn ghost sm" type="submit">검색</button>
        <a class="btn ghost sm" th:if="${search.filtered}" th:href="@{/admin/posts}">초기화</a>
        <span class="count">(표시 <span th:text="${#lists.size(result.items)}">0</span>건 / 총 <span th:text="${result.total}">0</span> 건)</span>
      </div>
      <a class="btn primary" th:href="@{/admin/posts/new}">신규 등록</a>
    </form>

    <table class="list">
      <thead>
      <tr>
        <th style="width:70px">ID</th>
        <th>게시물</th>
        <th style="width:120px">카테고리</th>
        <th style="width:90px">상태</th>
        <th style="width:80px" class="right">조회수</th>
        <th style="width:110px">작성자</th>
        <th style="width:140px">수정일</th>
        <th style="width:170px" class="right">액션</th>
      </tr>
      </thead>
      <tbody>
      <tr th:if="${result.empty}">
        <td colspan="8">
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 16s1.5-2 4-2 4 2 4 2"/><path d="M9 9h.01M15 9h.01"/></svg>
            <div th:text="${search.filtered} ? '조건에 맞는 게시물이 없습니다.' : '등록된 게시물이 없습니다.'">등록된 게시물이 없습니다.</div>
          </div>
        </td>
      </tr>
      <tr th:each="p : ${result.items}">
        <td class="num" th:text="${p.id}">1</td>
        <td>
          <div class="title-cell">
            <img class="thumb" th:if="${p.thumbnailUrl != null}" th:src="${p.thumbnailUrl}" alt="">
            <span class="thumb empty" th:if="${p.thumbnailUrl == null}">no img</span>
            <div>
              <a class="t" th:href="@{/admin/posts/{id}/preview(id=${p.id})}" target="_blank" th:text="${p.title}" title="새 탭에서 미리보기">제목</a>
              <div class="s" th:text="${p.summary}"></div>
            </div>
          </div>
        </td>
        <td th:text="${p.categoryName ?: '-'}">카테고리</td>
        <td><span class="badge" th:classappend="${p.status.css}" th:text="${p.status.label}">상태</span></td>
        <td class="right" th:text="${#numbers.formatInteger(p.viewCount, 1, 'COMMA')}">0</td>
        <td class="nowrap" th:text="${p.authorName}">작성자</td>
        <td class="muted nowrap" th:text="${#temporals.format(p.updatedAt, 'yyyy-MM-dd HH:mm')}">-</td>
        <td class="right">
          <div class="actions">
            <a class="btn ghost xs" th:href="@{/admin/posts/{id}/edit(id=${p.id})}">수정</a>
            <form th:if="${me.role.canManageContent() and p.status.name() != 'PUBLISHED'}"
                  th:action="@{/admin/posts/{id}/status(id=${p.id})}" method="post">
              <input type="hidden" name="status" value="PUBLISHED">
              <button class="btn ghost xs accent" type="submit">게시</button>
            </form>
            <form th:if="${me.role.canManageContent() and p.status.name() == 'PUBLISHED'}"
                  th:action="@{/admin/posts/{id}/status(id=${p.id})}" method="post">
              <input type="hidden" name="status" value="HIDDEN">
              <button class="btn ghost xs" type="submit">숨김</button>
            </form>
            <form th:if="${me.role.canManageContent()}" th:action="@{/admin/posts/{id}/delete(id=${p.id})}" method="post" data-confirm="이 게시물을 삭제할까요? 목록에서 제외되며 프론트에 노출되지 않습니다.">
              <button class="btn danger xs" type="submit">삭제</button>
            </form>
          </div>
        </td>
      </tr>
      </tbody>
    </table>

    <nav class="pager" th:if="${result.totalPages > 1}">
      <a th:if="${result.hasPrev}" th:href="@{/admin/posts(page=${result.page - 1}, size=${search.size}, keyword=${search.keyword}, categoryId=${search.categoryId}, status=${search.status})}">‹</a>
      <span class="dis" th:unless="${result.hasPrev}">‹</span>
      <th:block th:each="n : ${result.pageNumbers}">
        <span class="cur" th:if="${n == result.page}" th:text="${n}">1</span>
        <a th:unless="${n == result.page}" th:text="${n}"
           th:href="@{/admin/posts(page=${n}, size=${search.size}, keyword=${search.keyword}, categoryId=${search.categoryId}, status=${search.status})}">2</a>
      </th:block>
      <a th:if="${result.hasNext}" th:href="@{/admin/posts(page=${result.page + 1}, size=${search.size}, keyword=${search.keyword}, categoryId=${search.categoryId}, status=${search.status})}">›</a>
      <span class="dis" th:unless="${result.hasNext}">›</span>
    </nav>
  </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(${form.id == null} ? '게시물 등록' : '게시물 수정', ~{::main}, ~{::scripts})}">
<body>
<main>
  <h2 class="page-title">
    <span th:text="${form.id == null} ? '게시물 등록' : '게시물 수정'">게시물 등록</span>
    <span class="sub" th:if="${post != null}">
      ID <span th:text="${post.id}">1</span> ·
      작성 <span th:text="${post.authorName}"></span> ·
      최종 수정 <span th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}"></span> ·
      조회 <span th:text="${post.viewCount}">0</span>
    </span>
  </h2>

  <form id="postForm" th:object="${form}" method="post"
        th:action="${form.id == null} ? @{/admin/posts} : @{/admin/posts/{id}(id=${form.id})}">
    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{blocksJson}" id="blocksJson">

    <div class="alert error" th:if="${#fields.hasGlobalErrors()}">
      <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
    </div>

    <div class="row-2">
      <!-- 좌측: 제목 + 블록 에디터 -->
      <div class="card">
        <div class="card-body">
          <input class="input wide" th:field="*{title}" placeholder="제목을 입력하세요" maxlength="200"
                 style="height:44px;font-size:18px;font-weight:700;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 4px">
          <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>

          <div id="editor" class="be" style="margin-top:14px"></div>
          <div class="field-error" th:if="${#fields.hasErrors('blocksJson')}" th:errors="*{blocksJson}"></div>
          <p class="help">블록을 추가해 본문을 구성합니다. 텍스트 블록을 선택하면 굵기·기울임·밑줄·글자 크기·색상 도구가 나타납니다. 글꼴은 프론트 화면에서 고정됩니다.</p>
        </div>
        <div class="sticky-bar">
          <div class="actions">
            <a class="btn ghost" th:href="@{/admin/posts}">목록</a>
            <button class="btn danger" type="submit" form="deleteForm" th:if="${form.id != null and me.role.canManageContent()}">삭제</button>
          </div>
          <div class="actions">
            <button class="btn ghost" type="submit" th:formaction="@{/admin/posts/preview}" formtarget="_blank" formnovalidate
                    title="저장하지 않고 현재 내용을 프론트 화면 형태로 확인합니다">미리보기</button>
            <button class="btn primary" type="submit">저장</button>
          </div>
        </div>
      </div>

      <!-- 우측: 발행 설정 -->
      <div>
        <div class="card side-card">
          <div class="card-body">
            <h4>발행 설정</h4>
            <div class="form-grid">
              <label class="lbl" for="status">상태</label>
              <select class="select" th:field="*{status}" id="status">
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.label}"></option>
              </select>

              <label class="lbl" for="categoryId">카테고리</label>
              <div>
                <select class="select" th:field="*{categoryId}" id="categoryId" style="width:100%">
                  <option value="">(미분류)</option>
                  <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
                <div class="help" th:if="${me.role.canManageContent()}">필요한 카테고리가 없으면 <a th:href="@{/admin/categories}" target="_blank" style="color:var(--blue)">카테고리 관리</a>에서 추가하세요.</div>
              </div>

              <label class="lbl" for="summary">요약</label>
              <div>
                <textarea class="textarea" th:field="*{summary}" id="summary" rows="3" maxlength="500" style="width:100%"
                          placeholder="비우면 본문 앞부분에서 자동 생성"></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="card side-card">
          <div class="card-body">
            <h4>대표 이미지</h4>
            <div class="radio-row" style="padding-top:0">
              <label><input type="radio" th:field="*{thumbnailMode}" value="AUTO"> 본문 첫 이미지 자동 사용</label>
              <label><input type="radio" th:field="*{thumbnailMode}" value="MANUAL"> 직접 지정</label>
            </div>
            <div id="thumbManual" style="margin-top:12px">
              <input type="hidden" th:field="*{thumbnailUrl}" id="thumbnailUrl">
              <div id="thumbPreview" style="margin-bottom:8px">
                <img th:if="${form.thumbnailUrl != null and form.thumbnailUrl != ''}" th:src="${form.thumbnailUrl}" alt=""
                     style="width:100%;max-height:170px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">
              </div>
              <div class="actions">
                <label class="btn ghost sm" style="cursor:pointer">
                  이미지 업로드 <input type="file" id="thumbFile" accept="image/*" hidden>
                </label>
                <button class="btn ghost sm" type="button" id="thumbClear">지우기</button>
              </div>
              <div class="help">권장 1200×630 (JPG·PNG·GIF·WEBP, 10MB 이하). 목록·프론트 카드에 사용됩니다.</div>
            </div>
            <div class="help" id="thumbAutoHelp">본문의 첫 이미지 블록이 대표 이미지가 됩니다. 이미지가 없으면 대표 이미지 없이 표시됩니다.</div>
          </div>
        </div>
      </div>
    </div>
  </form>

  <!-- 삭제 폼 (중첩 form 을 피하기 위해 본문 폼 밖에 둠; 버튼은 form="deleteForm" 으로 연결) -->
  <form id="deleteForm" th:if="${form.id != null and me.role.canManageContent()}" th:action="@{/admin/posts/{id}/delete(id=${form.id})}" method="post"
        data-confirm="이 게시물을 삭제할까요? 목록에서 제외되며 프론트에 노출되지 않습니다."></form>
</main>

<th:block th:fragment="scripts">
  <script th:src="@{/js/block-editor.js}"></script>
  <script th:inline="javascript">
    (function () {
      var editor = BlockEditor.mount(document.getElementById('editor'), {
        input: document.getElementById('blocksJson'),
        uploadUrl: /*[[@{/admin/images}]]*/ '/admin/images',
        recentUrl: /*[[@{/admin/images/recent}]]*/ '/admin/images/recent'
      });
      document.getElementById('postForm').addEventListener('submit', function () { editor.sync(); });

      // 대표 이미지 모드 토글
      var radios = document.querySelectorAll('input[name="thumbnailMode"]');
      function toggleThumb() {
        var manual = document.querySelector('input[name="thumbnailMode"]:checked').value === 'MANUAL';
        document.getElementById('thumbManual').style.display = manual ? '' : 'none';
        document.getElementById('thumbAutoHelp').style.display = manual ? 'none' : '';
      }
      radios.forEach(function (r) { r.addEventListener('change', toggleThumb); });
      toggleThumb();

      document.getElementById('thumbFile').addEventListener('change', function () {
        var file = this.files[0];
        if (!file) return;
        BlockEditor.upload(file, /*[[@{/admin/images}]]*/ '/admin/images').then(function (res) {
          document.getElementById('thumbnailUrl').value = res.url;
          document.getElementById('thumbPreview').innerHTML =
            '<img src="' + res.url + '" alt="" style="width:100%;max-height:170px;object-fit:cover;border-radius:6px;border:1px solid var(--line)">';
        }).catch(function (e) { notify(e.message || '업로드에 실패했습니다.', true); });
        this.value = '';
      });
      document.getElementById('thumbClear').addEventListener('click', function () {
        document.getElementById('thumbnailUrl').value = '';
        document.getElementById('thumbPreview').innerHTML = '';
      });
    })();
  </script>
</th:block>
</body>
</html>
